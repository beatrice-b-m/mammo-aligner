[project]
name = "mg-aligner"
version = "0.1.0"
description = "Check and realign the orientation of mammography images and coordinates."
authors = [
    { name = "Beatrice Brown-Mulry", email = "bbrownmulry@gmail.com" }
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/beatrice-b-m/mg-aligner"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "pytest>=9.2.0",
]
validation = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pydicom>=3",
    "pylibjpeg[all]>=2.1.0",
]
